<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Back Four — the daily football grouping puzzle</title>
<meta name="description" content="Back Four: a daily football puzzle. Sixteen names, one theme, four hidden connections. New puzzle every day.">
<meta name="theme-color" content="#f3f1ea">
<meta property="og:title" content="Back Four">
<meta property="og:description" content="Sixteen names. One theme. Four hidden connections.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%9A%BD</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Expanded:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=9">
</head>
<body>

<div class="ambient" id="ambient" aria-hidden="true">
  <!-- football -->
  <div class="floaty tint0" data-depth="26" style="top:14%;left:4%;width:120px;height:120px;--rot:-4deg;--dur:19s">
    <div class="floaty-inner"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3">
      <circle cx="50" cy="50" r="44"/><path d="M50 20l16 12-6 19H40l-6-19z" fill="currentColor" stroke="none"/>
      <path d="M50 32l0-12M66 44l11-6M60 63l9 14M40 63l-9 14M34 44l-11-6"/></svg></div>
  </div>
  <!-- trophy -->
  <div class="floaty tint3 hide-sm" data-depth="40" style="top:22%;right:3%;width:96px;height:150px;--rot:3deg;--dur:22s">
    <div class="floaty-inner"><svg viewBox="0 0 80 120" fill="none" stroke="currentColor" stroke-width="3">
      <path d="M24 16h32v18a16 16 0 0 1-32 0z"/><path d="M24 22c-12 0-14 16-2 18M56 22c12 0 14 16 2 18"/>
      <path d="M40 50v20M28 70h24M32 84h16l-2 12H34z"/><path d="M26 96h28"/></svg></div>
  </div>
  <!-- crest / shield -->
  <div class="floaty tint1 hide-sm" data-depth="34" style="bottom:16%;left:5%;width:104px;height:126px;--rot:2deg;--dur:20s">
    <div class="floaty-inner"><svg viewBox="0 0 90 110" fill="none" stroke="currentColor" stroke-width="3">
      <path d="M45 6l36 12v34c0 28-22 44-36 52C31 96 9 80 9 52V18z"/><path d="M45 6v96M9 40h72"/></svg></div>
  </div>
  <!-- stadium arc / floodlight -->
  <div class="floaty hide-sm" data-depth="20" style="top:52%;right:6%;width:150px;height:110px;--rot:-3deg;--dur:24s">
    <div class="floaty-inner"><svg viewBox="0 0 150 110" fill="none" stroke="currentColor" stroke-width="3">
      <path d="M8 96C8 52 42 24 75 24s67 28 67 72"/><path d="M20 96C20 60 46 38 75 38s55 22 55 58"/>
      <path d="M75 2v14M40 8l6 12M110 8l-6 12"/></svg></div>
  </div>
  <!-- centre circle / pitch -->
  <div class="floaty" data-depth="16" style="bottom:8%;right:12%;width:130px;height:130px;--rot:4deg;--dur:26s">
    <div class="floaty-inner"><svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="3">
      <rect x="6" y="6" width="108" height="108" rx="6"/><circle cx="60" cy="60" r="26"/>
      <path d="M60 6v108M6 60h108"/><circle cx="60" cy="60" r="4" fill="currentColor" stroke="none"/></svg></div>
  </div>
  <!-- pennant / scarf -->
  <div class="floaty tint2 hide-sm" data-depth="30" style="top:8%;left:44%;width:120px;height:74px;--rot:-5deg;--dur:17s">
    <div class="floaty-inner"><svg viewBox="0 0 120 74" fill="none" stroke="currentColor" stroke-width="3">
      <path d="M8 14h104l-24 20 24 20H8z"/><path d="M8 14v52"/><path d="M30 34h44"/></svg></div>
  </div>
  <!-- halftone panel (screenprint texture) -->
  <div class="floaty hide-sm" data-depth="12" style="bottom:30%;left:40%;width:96px;height:120px;--rot:3deg;--dur:28s">
    <div class="floaty-inner"><svg viewBox="0 0 60 76"><g fill="currentColor">
      <circle cx="8" cy="8" r="3"/><circle cx="22" cy="8" r="3"/><circle cx="36" cy="8" r="3"/><circle cx="50" cy="8" r="3"/>
      <circle cx="8" cy="22" r="2.4"/><circle cx="22" cy="22" r="2.4"/><circle cx="36" cy="22" r="2.4"/><circle cx="50" cy="22" r="2.4"/>
      <circle cx="8" cy="36" r="1.8"/><circle cx="22" cy="36" r="1.8"/><circle cx="36" cy="36" r="1.8"/><circle cx="50" cy="36" r="1.8"/>
      <circle cx="8" cy="50" r="1.2"/><circle cx="22" cy="50" r="1.2"/><circle cx="36" cy="50" r="1.2"/><circle cx="50" cy="50" r="1.2"/>
      <circle cx="8" cy="64" r="0.8"/><circle cx="22" cy="64" r="0.8"/><circle cx="36" cy="64" r="0.8"/><circle cx="50" cy="64" r="0.8"/>
    </g></svg></div>
  </div>
</div>

<header class="topbar">
  <a class="brand" href="./" aria-label="Back Four home">
    <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span class="brand-text">Back Four</span>
  </a>
  <nav class="topbar-actions">
    <button class="icon-btn" id="btn-how" type="button" aria-label="How to play">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M9.1 9a2.9 2.9 0 1 1 4 2.7c-.8.4-1.2 1-1.2 1.9v.4"/><circle cx="12" cy="17.5" r="1.15" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="icon-btn" id="btn-stats" type="button" aria-label="Your record">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M4 20V11M12 20V4M20 20v-6"/></svg>
    </button>
    <button class="icon-btn" id="btn-archive" type="button" aria-label="Puzzle archive">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
  </nav>
</header>

<main class="wrap">

  <section class="billing">
    <p class="billing-kicker">
      <span id="puzzle-label">Puzzle</span>
      <span class="sep" aria-hidden="true"></span>
      <span id="puzzle-date"></span>
    </p>
    <h1 class="billing-theme" id="theme-name"></h1>
    <p class="billing-sub"><b>Sixteen names.</b> Four hidden connections. Find the back four.</p>
  </section>

  <section id="solved" class="solved" aria-label="Solved groups"></section>
  <section id="board" class="board" aria-label="Puzzle tiles"></section>

  <p class="live" id="live" role="status" aria-live="polite"></p>

  <div class="tray" id="tray">
    <div class="mistakes" id="mistakes-row">
      <span class="mistakes-label">Mistakes</span>
      <span class="lives" id="lives"></span>
    </div>
    <div class="controls" id="controls">
      <button class="btn" id="btn-shuffle" type="button">Shuffle</button>
      <button class="btn" id="btn-deselect" type="button">Deselect</button>
      <button class="btn btn-primary" id="btn-submit" type="button" disabled>Submit</button>
    </div>
  </div>

  <div class="endgame" id="endgame" hidden>
    <div class="report">
      <div class="report-head">
        <span class="report-label">Match report</span>
        <span class="ft-badge" id="ft-badge">Full time</span>
      </div>
      <h2 id="endgame-title"></h2>
      <p id="endgame-sub"></p>
      <div class="share-grid" id="share-grid" aria-hidden="true"></div>
    </div>
    <div class="endgame-actions">
      <button class="btn btn-primary" id="btn-share" type="button">Share result</button>
      <button class="btn" id="btn-next" type="button">Play the archive</button>
    </div>
  </div>

</main>

<footer class="foot">
  <span class="foot-mark">Back Four</span>
  <span class="foot-dot" aria-hidden="true"></span>
  <span>a new football puzzle daily at local midnight</span>
</footer>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="modal-close" id="modal-close" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
  </div>
</div>

<script src="puzzles.js?v=9"></script>
<script src="app.js?v=9"></script>
<script src="motion.js?v=9"></script>

<!-- Cloudflare Web Analytics -->
<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "ddd5cfe628cc4f4fba42a49a3e3b356c"}'></script>
<!-- End Cloudflare Web Analytics -->
</body>
</html>
